name: Build Algerian 07-144 nomenclature

on:
  push:
    branches:
      - bolt-latest-2026-08-19
    paths:
      - 'scripts/build-nomenclature-07-144.py'
      - '.github/workflows/build-nomenclature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nomenclature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate nomenclature dataset
        run: python3 scripts/build-nomenclature-07-144.py

      - name: Commit generated dataset
        run: |
          git config user.name "URATEC Manager Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/nomenclature-07-144.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(environment): update 07-144 nomenclature dataset"
          git push
