name: Generate 07-144 Nomenclature

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-nomenclature-07144.py
      - .github/workflows/generate-nomenclature-07144.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Generate dataset
        run: python3 scripts/generate-nomenclature-07144.py

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nomenclature-07-144.json
          if git diff --cached --quiet; then
            echo "No nomenclature changes."
            exit 0
          fi
          git commit -m "chore(environment): refresh 07-144 nomenclature dataset"
          git push
